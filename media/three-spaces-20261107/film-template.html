<body><div id="film"><div class="wall" id="wall"></div><header><b>여운</b><span>타로 AI 마음 대화</span><small id="chapter"></small></header><div class="content" id="content"></div><div id="tap"></div><div id="subtitles"></div><div class="progress" id="progress"></div></div>
<script>
/*BANK*/
const params=new URLSearchParams(location.search),vertical=params.get('mode')==='portrait',guide=params.get('mode')==='guide';
document.body.className=(vertical?'vertical ':'')+(guide?'guide':'');
const film=document.getElementById('film'),content=document.getElementById('content'),wall=document.getElementById('wall'),tap=document.getElementById('tap'),subtitles=document.getElementById('subtitles');
const screen=name=>'../../docs/quality/three-skins-20261107/screens/'+name+'.png';
const pic=(name,cls='capture')=>'<img class="'+cls+'" src="'+screen(name)+'">';
const person=(id,expression='calm')=>assets.characters[id][expression+'.open'];
let scene=-1,variant='',previousPerson='';
const clamp=(x)=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
function room(id){const art=assets.rooms[id];wall.innerHTML='<div class="side">'+art+'</div><div class="side">'+art+'</div>';document.body.style.background=assets.themes[id].paper;}
function speech(title,sub,stage,eyebrow=''){return '<div class="copy"><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><div class="stage">'+stage+'</div>';}
function app(inner,label='여운과 마음 대화'){return '<div class="app"><div class="appbar"><span>‹ &nbsp;'+label+'</span><small>대화 예시</small></div>'+inner+'<div class="actual-label">대화 내용은 사용 예시예요.</div></div>';}
function showTap(t,at,x,y){const u=(t-at)/.7;if(u<0||u>1)return;tap.style.display='block';tap.style.left=(x-32)+'px';tap.style.top=(y-32)+'px';tap.style.opacity=String(1-u);tap.style.transform='scale('+(0.65+u*1.1)+')';}
const captions=[
 [1,5.7,'누군가에게 꺼내기 어려웠던 말, 있나요?'],
 [7.8,11.0,'오늘은, 내가 편한 곳에서 이야기해요.'],
 [11.0,14.6,'카페에서도, 차분한 진료실에서도,'],
 [14.6,18.2,'고양이가 있는 놀이방에서도요.'],
 [19,23.2,'잘 정리된 말이 아니어도 괜찮아요.'],
 [23.2,28.1,'여운이 먼저 듣고, 이해한 마음이 맞는지 물어볼게요.'],
 [30,36.8,'타로 카드를 한 장씩 펼치며, 나를 위한 작은 관점을 찾아봐요.'],
 [41,44.8,'지금 할 수 있는 한 가지를 살펴보고,'],
 [44.8,49,'마음에 남은 말은 기록으로.'],
 [52,56.5,'말하지 못했던 마음에, 작은 여운을.'],
 [56.5,59.8,'타로 AI 마음 대화, 여운.']
];
function targetTap(t,at,selector,u=.5,v=.5){
 const el=document.querySelector(selector);if(!el)return;
 const b=el.getBoundingClientRect();showTap(t,at,b.x+b.width*u,b.y+b.height*v);
}
function intro(t){
 const next=t<7?0:t<18.5?1:t<29.5?2:t<40.5?3:t<51?4:5;
 if(next!==scene){scene=next;variant='';previousPerson='';room(next===0||next===5?'playroom':next===2||next===3?'cafe':next===4?'clinic':'playroom');
  document.getElementById('chapter').textContent=String(next+1).padStart(2,'0')+' / 06';
  if(next===0)content.innerHTML=speech('꺼내기 어려웠던 말,<br><em>여기서 천천히.</em>','나를 위한 작은 관점과 조언.<br>타로 AI 마음 대화, 여운.','<div class="solo"><div class="scene-person" id="character"></div></div>','누군가의 곁이 필요한 날');
  if(next===1)content.innerHTML='<h1 class="spaces-title">오늘의 마음에 맞는 <em>공간.</em></h1><div class="spaces">'+['cafe','clinic','playroom'].map(id=>'<div class="room-phone" data-room="'+id+'"><div class="photo">'+pic('home-'+id,'')+'</div><p>'+assets.names[id]+'</p></div>').join('')+'</div>';
  if(next===2)content.innerHTML=speech('먼저 듣고,<br><em>맞게 이해했는지.</em>','편하게 이야기해 주세요.<br>제대로 이해했는지 먼저 여쭤봐요.','<div id="dialogue" style="width:100%"></div>','공감 → 이해 확인');
  if(next===3)content.innerHTML=speech('한 장씩 펼쳐보는<br><em>나를 위한 관점.</em>','정해진 답을 강요하지 않아요.<br>내 마음을 살펴볼 작은 힌트를 찾아요.','<div class="cards">'+[1,2,3].map(i=>'<div class="card" id="card'+i+'"><div class="front">'+pic('card-'+i,'')+'</div><div class="back"><span>여운</span></div></div>').join('')+'</div><div class="card-caption">확인한 이야기와 함께, 카드를 살펴봐요.</div>','타로와 함께 마음 살피기');
  if(next===4)content.innerHTML=speech('마음에 남은 말은,<br><em>나의 기록으로.</em>','오늘 할 수 있는 작은 한 가지.<br>다음의 나에게도 다정하게 남겨요.','<div id="record" style="width:100%"></div>','조언 → 마음기록');
  if(next===5)content.innerHTML='<div class="ending"><div class="trio">'+['cafe','clinic','playroom'].map(id=>'<div>'+person(id,'welcome')+'</div>').join('')+'</div><h1>말하지 못했던 마음에,<br><em>작은 여운을.</em></h1><div class="wordmark">여운</div><p class="sub">타로 AI 마음 대화</p><div class="cta">오늘은, 내 마음 곁에.</div></div>';
 }
 if(next===0){const expression=t<2.1?'welcome':'calm',blink=t%4.2>3.95,key=expression+'.'+(blink?'blink':'open');if(key!==previousPerson){document.getElementById('character').innerHTML=assets.characters.playroom[key];previousPerson=key;}document.getElementById('character').style.transform='translateY('+(-3*Math.sin(t*1.3))+'px)';}
 if(next===1){const id=t<11.2?'cafe':t<14.5?'clinic':'playroom';if(id!==variant){variant=id;room(id);document.querySelectorAll('.room-phone').forEach(el=>el.querySelector('.photo').classList.toggle('active',el.dataset.room===id));}document.querySelectorAll('.room-phone').forEach((el,i)=>{el.style.transform='translateY('+((1-ease((t-7-i*.12)/.7))*60+(el.dataset.room===id?-10:6))+'px) scale('+(el.dataset.room===id?1.025:.97)+')';});if(vertical)document.querySelectorAll('.room-phone').forEach(el=>el.style.opacity=el.dataset.room===id?'1':'0');
 [8.5,11.2,14.5].forEach((at,i)=>targetTap(t,at,'.room-phone[data-room="'+['cafe','clinic','playroom'][i]+'"] .photo',.5,.30));}
 if(next===2){const state=t<22.4?'input':t<23.1?'wait':'confirm';if(state!==variant){variant=state;document.getElementById('dialogue').innerHTML=app(state==='input'?'<div class="bubbles">수업과 알바를 함께 챙기느라<br>쉬는 시간이 부족해요.</div>'+pic('input-panel'):state==='wait'?'<div class="wait"><i></i><i></i><i></i> 마음을 천천히 듣고 있어요.</div>':pic('empathy-panel')+pic('confirmation-panel')+pic('confirm-button'));}
 targetTap(t,22.2,'#dialogue .capture:last-of-type',.82,.8);targetTap(t,26.6,'#dialogue .capture:last-of-type');}
 if(next===3){for(let i=1;i<=3;i++){const q=ease((t-31.2-(i-1)*.62)/.85),fan=(i-2)*(1-q)*7;document.getElementById('card'+i).style.transform='translateY('+(-Math.sin(q*Math.PI)*20)+'px) rotate('+fan+'deg) rotateY('+(180*(1-q))+'deg)';}targetTap(t,31.1,'#card1');}
 if(next===4){const state=t<45.7?'advice':'journal';if(state!==variant){variant=state;document.getElementById('record').innerHTML=app(state==='advice'?pic('advice-panel')+pic('record-button'):'<div class="record-chips"><span>오늘의 마음</span><span>내가 고른 말</span></div>'+pic('journal-input')+pic('journal-button'),state==='advice'?'지금의 나에게':'마음 남기기');}targetTap(t,45.4,'#record .capture:last-of-type');}
 const start=[0,7,18.5,29.5,40.5,51][next];content.style.opacity=String(ease((t-start)/.5));content.style.transform='translateY('+((1-ease((t-start)/.6))*24)+'px)';
 const caption=captions.find(x=>t>=x[0]&&t<x[1]);subtitles.innerHTML=caption?'<span>'+caption[2]+'</span>':'';
}
function walkthrough(t){
 const i=t<5?0:t<12?1:t<20?2:3,key=i===0?'cafe':i===1?'playroom':i===2?'playroom':'clinic';
 if(i!==scene){scene=i;room(key);const title=['공간을 고르면,<br><em>전체가 달라져요.</em>','놀이방에서는,<br><em>고양이가 반겨요.</em>','소리는 내 취향대로,<br><em>조용하게도 좋아요.</em>','차분한 진료실도,<br><em>같은 여운이에요.</em>'][i],sub=['홈에서 카페 · 진료실 · 놀이방 중 하나를 눌러요.','캐릭터를 가볍게 눌러 인사해 보세요.','내 공간에서 효과음과 움직임을 고를 수 있어요.','의사는 단정한 옆가르마.<br>상담에서도 고른 안내자가 함께해요.'][i];
 content.innerHTML=speech(title,sub,'<div class="guide-phone">'+pic('home-'+key,'')+'</div>','사용방법 '+String(i+1).padStart(2,'0')+' / 04');
 if(i===0)content.querySelector('.copy').innerHTML+='<div class="guide-focus">'+pic('space-selector-cafe','')+'</div>';
 if(i===2)content.querySelector('.copy').innerHTML+='<div class="guide-focus">'+pic('audio-switch','')+pic('motion-switch','')+'</div>';
 }
 if(i===0)targetTap(t,2,'.guide-focus img',.82,.5);if(i===1){targetTap(t,7,'.guide-phone>img',.82,.295);targetTap(t,9.4,'.guide-phone>img',.5,.55);}if(i===2)targetTap(t,14,'.guide-focus img',.94,.5);
 const start=[0,5,12,20][i];content.style.opacity=String(ease((t-start)/.5));content.style.transform='translateY('+((1-ease((t-start)/.6))*20)+'px)';
 document.getElementById('chapter').textContent='사용방법 / 30초';subtitles.innerHTML='<span>'+['한 번 선택하면 다음에도 같은 공간으로 열려요.','야옹은 효과음을 켠 뒤 직접 눌렀을 때만 들려요.','녹음 중에는 소리가 멈추고, 움직임 줄이기도 지원해요.','캐릭터는 단순하게, 공간은 내 취향으로.'][i]+'</span>';
}
window.renderFrame=t=>{tap.style.display='none';guide?walkthrough(t):intro(t);document.getElementById('progress').style.width=(100*t/(guide?30:60))+'%';};
window.renderFrame(0);window.filmReady=true;
</script></body></html>
